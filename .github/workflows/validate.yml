name: validate

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runtime/remotion/package-lock.json
      - name: Install Remotion dependencies
        working-directory: runtime/remotion
        run: npm ci
      - name: Typecheck Remotion runtime
        working-directory: runtime/remotion
        run: npm run typecheck
      - name: Test workflow contracts and publish gates
        shell: pwsh
        run: ./tests/Test-Workflow.ps1
