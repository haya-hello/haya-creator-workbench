name: validate-skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate privacy and structure
        run: python3 tools/validate_skill.py .
      - name: Run smoke tests
        run: bash tests/smoke.sh
